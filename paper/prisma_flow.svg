<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="Segoe UI,system-ui,sans-serif">
  <defs>
    <marker id="pa" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6c757d"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#165A97">PRISMA-lite screening flow — snapshot 2026-10-31 (paper/lit_review_agentic_contextual.md)</text>

  <!-- 1. Corpus -->
  <rect x="60" y="52" width="520" height="64" rx="10" fill="#f4f7fa" stroke="#165A97" stroke-width="2"/>
  <text x="320" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#165A97">Curated corpus</text>
  <text x="320" y="100" text-anchor="middle" font-size="13" fill="#6c757d">15,773 papers · 11 categories × 6 lenses (papers.yaml)</text>
  <line x1="320" y1="116" x2="320" y2="134" stroke="#6c757d" stroke-width="2" marker-end="url(#pa)"/>

  <!-- 2. agentic screen -->
  <rect x="60" y="138" width="520" height="58" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="320" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#165A97">Screen 1 — "agentic" in title/abstract → 167</text>
  <text x="320" y="182" text-anchor="middle" font-size="12.5" fill="#6c757d">all 2025–2026 · highest-momentum trend</text>
  <line x1="320" y1="196" x2="320" y2="214" stroke="#6c757d" stroke-width="2" marker-end="url(#pa)"/>

  <!-- 3. sales narrow -->
  <rect x="60" y="218" width="520" height="58" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="320" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#165A97">Screen 2 — + sales / lead / B2B / CRM / selling / buyer → 64</text>
  <text x="320" y="262" text-anchor="middle" font-size="12.5" fill="#6c757d">agentic × commercial roles</text>
  <line x1="320" y1="276" x2="320" y2="294" stroke="#6c757d" stroke-width="2" marker-end="url(#pa)"/>

  <!-- 4. context screen -->
  <rect x="60" y="298" width="520" height="58" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="320" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#165A97">Screen 3 — "contextual intelligence" / "context-aware" → 380</text>
  <text x="320" y="342" text-anchor="middle" font-size="12.5" fill="#6c757d">channel-level usage dominates (advertising, attribution, pricing)</text>
  <line x1="320" y1="356" x2="320" y2="374" stroke="#6c757d" stroke-width="2" marker-end="url(#pa)"/>

  <!-- 5. intersection -->
  <rect x="60" y="378" width="520" height="58" rx="10" fill="#E5F0CF" stroke="#165A97" stroke-width="2"/>
  <text x="320" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#165A97">Screen 4 — intersection (agent × context vocabularies) → 18</text>
  <text x="320" y="422" text-anchor="middle" font-size="12.5" fill="#6c757d">broadened agent pool 384 (agentic / multi-agent / autonomous / ai / llm agent)</text>
  <line x1="320" y1="436" x2="320" y2="454" stroke="#6c757d" stroke-width="2" marker-end="url(#pa)"/>

  <!-- 6. full-text screen -->
  <rect x="60" y="458" width="520" height="58" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="320" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#165A97">Screen 5 — full-text screen: substantive vs lexical → 2 + ≤16</text>
  <text x="320" y="502" text-anchor="middle" font-size="12.5" fill="#6c757d">retail-pricing multi-agent framework · contextualized-persuasion study</text>
  <line x1="320" y1="516" x2="320" y2="534" stroke="#6c757d" stroke-width="2" marker-end="url(#pa)"/>

  <!-- 7. value opportunity (parallel screen) -->
  <rect x="660" y="150" width="220" height="72" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="770" y="178" text-anchor="middle" font-size="13.5" font-weight="700" fill="#165A97">Parallel screen</text>
  <text x="770" y="198" text-anchor="middle" font-size="12.5" fill="#6c757d">"value opportunity" → 0</text>
  <text x="770" y="214" text-anchor="middle" font-size="11" fill="#adb5bd">construct not yet agentified</text>
  <line x1="580" y1="84" x2="652" y2="176" stroke="#6c757d" stroke-width="1.5" marker-end="url(#pa)"/>
  <path d="M 770 222 L 770 600 L 588 600" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#pa)"/>

  <!-- 8. included -->
  <rect x="60" y="538" width="520" height="64" rx="10" fill="#f4f7fa" stroke="#165A97" stroke-width="2"/>
  <text x="320" y="564" text-anchor="middle" font-size="15" font-weight="700" fill="#165A97">Included</text>
  <text x="320" y="586" text-anchor="middle" font-size="13" fill="#6c757d">27 corpus papers + 10 verified external anchors = 37 references</text>
  <line x1="320" y1="602" x2="320" y2="620" stroke="#6c757d" stroke-width="2" marker-end="url(#pa)"/>

  <text x="320" y="646" text-anchor="middle" font-size="12.5" fill="#6c757d">→ feeds: G1 construct definition · G4 situational awareness · G6 B2B-CI · 2027 Working Paper related work</text>
  <text x="320" y="668" text-anchor="middle" font-size="11" fill="#adb5bd">counts are live lower bounds — the corpus grows weekly; re-run screens at submission (§2, Appendix A)</text>
</svg>
