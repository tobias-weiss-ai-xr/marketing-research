inputs:
  - file: papers.yaml
    format: yaml
    list_key: papers
    id_field: title
    url_fields: [url, code_url, project_url]
settings:
  timeout: 20
  workers: 4
  per_host_delay: 0.5
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  browser: false
  fail_on_broken: true
  fail_early: true
  report: verify-sources-report.json
