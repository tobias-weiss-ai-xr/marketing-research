# ── GitHub repository discovery (fetch_github_repos.py) ─────────────────────
# Each entry is a GitHub search query (topic:, keyword combos, stars:>N).
# Optional keys: category, subcategory_hint, min_stars (per-query override).
github_queries:
  - query: "marketing+analytics+stars:>50"
    category: analytics
    subcategory_hint: measurement
  - query: "marketing+automation+stars:>50"
    category: digital-marketing
    subcategory_hint: case-study
  - query: "topic:marketing+stars:>100"
    category: survey
    subcategory_hint: review
  - query: "advertising+personalization+stars:>50"
    category: digital-marketing
    subcategory_hint: measurement

# ── Relevance signals for repo fetchers (optional) ──────────────────────────
# Extra keyword tokens shared by ALL repo fetchers (github, gitlab, codeberg)
# to filter out irrelevant repos from broad searches.
# Auto-extracted from: topic.name, topic.description, taxonomy IDs.
repo_signals:
  - "marketing"
  - "digital marketing"
  - "marketing automation"
  - "marketing analytics"
  - "advertising"
  - "customer journey"
