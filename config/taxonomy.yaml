# ⚙️ Research Taxonomy & Discovery Config — Marketing Research
#
# This is the ONLY file you need to adapt for your own research topic.
# Edit categories/subcategories + discovery queries, then re-run the pipeline.
#
# Pipeline:  config/taxonomy.yaml → papers.yaml → validate → README → reports

# ── Topic ────────────────────────────────────────────────────────────────────
topic:
  name: "Marketing Research"
  short: "marketing"
  description: "Latest marketing trends and evidence: AI & generative marketing, digital & performance marketing, social media & creator economy, content, consumer behavior, brand, analytics & attribution, privacy-first data, omnichannel CX & retail, B2B."
  openalex_mailto: "research@tobias-weiss-ai-xr.de"

# ── Taxonomy ─────────────────────────────────────────────────────────────────
# Categories = the main axis (marketing domains / trend areas).
# Subcategories = the secondary axis (research aspects).
# Every paper in papers.yaml must carry one category + one subcategory.
taxonomy:
  categories:
    - id: ai-marketing
      display: "AI & Marketing"
    - id: digital-marketing
      display: "Digital & Performance Marketing"
    - id: social-media
      display: "Social Media & Creator Marketing"
    - id: content-marketing
      display: "Content & Storytelling"
    - id: consumer-behavior
      display: "Consumer Behavior & Psychology"
    - id: brand
      display: "Brand Strategy & Management"
    - id: analytics
      display: "Analytics, Attribution & Measurement"
    - id: privacy-data
      display: "Data, Privacy & Cookieless Advertising"
    - id: cx-retail
      display: "Customer Experience, Omnichannel & Retail"
    - id: b2b
      display: "B2B & Account-Based Marketing"
    - id: survey
      display: "Surveys, Trends & Meta-Studies"
  subcategories:
    - id: empirical
      display: "Empirical Studies"
    - id: framework
      display: "Frameworks & Models"
    - id: review
      display: "Reviews & Surveys"
    - id: case-study
      display: "Case Studies & Practice"
    - id: theory
      display: "Theory & Conceptual"
    - id: measurement
      display: "Measurement & Methods"

# Keyword rules for automatic subcategory classification (fetch scripts).
# Fallback: if a query entry carries `subcategory_hint`, that hint wins.
subcategory_keywords:
  empirical:
    - "experiment"
    - "field study"
    - "empirical"
    - "evidence"
    - "survey data"
    - "randomized"
    - "panel data"
    - "large-scale"
    - "natural experiment"
    - "quasi-experimental"
  framework:
    - "framework"
    - "conceptual model"
    - "taxonomy"
    - "typology"
    - "architecture"
    - "design principles"
  review:
    - "review"
    - "meta-analysis"
    - "systematic"
    - "bibliometric"
    - "state of the art"
    - "research agenda"
    - "literature"
  case-study:
    - "case study"
    - "case analysis"
    - "practical implications"
    - "lessons learned"
    - "insights from"
    - "industry"
  theory:
    - "theory"
    - "theoretical"
    - "mechanism"
    - "construct"
    - "conceptualization"
  measurement:
    - "measurement"
    - "metric"
    - "attribution"
    - "analytics"
    - "instrument"
    - "methodology"
    - "modeling"

# ── Discovery: arXiv queries (fetch_new_papers.py) ───────────────────────────
# Each entry is an arXiv API query string (cat: + abs:/ti: operators).
# Dict entries can carry optional category/subcategory_hint for auto-classification.
arxiv_queries:
  - query: 'cat:cs.CY AND (abs:"advertising" OR abs:"marketing" OR abs:"targeted ads")'
    category: digital-marketing
    subcategory_hint: empirical
  - query: 'cat:cs.AI AND (abs:"marketing" OR abs:"recommendation advertising")'
    category: ai-marketing
    subcategory_hint: empirical
  - query: 'cat:cs.SI AND (abs:"social media" AND (abs:"marketing" OR abs:"influencer" OR abs:"brand"))'
    category: social-media
    subcategory_hint: empirical
  - query: 'cat:econ.GN AND (abs:"advertising" OR abs:"digital marketing" OR abs:"consumer")'
    category: consumer-behavior
    subcategory_hint: empirical

# ── Discovery: multi-source queries (fetch_other_sources.py) ─────────────────
# Each entry defines one query against a source (dblp, crossref, europepmc, …).
other_sources_queries:
  - source: crossref
    query: generative artificial intelligence marketing consumer
    category: ai-marketing
    subcategory_hint: empirical
  - source: crossref
    query: digital marketing artificial intelligence personalization
    category: ai-marketing
    subcategory_hint: framework
  - source: crossref
    query: social media influencer marketing
    category: social-media
    subcategory_hint: empirical
  - source: crossref
    query: privacy personalization advertising trade-off
    category: privacy-data
    subcategory_hint: empirical
  - source: crossref
    query: marketing mix modeling advertising effectiveness
    category: analytics
    subcategory_hint: measurement
  - source: crossref
    query: omnichannel customer experience retail
    category: cx-retail
    subcategory_hint: framework
  - source: dblp
    query: social media marketing
    category: social-media
    subcategory_hint: empirical
  - source: dblp
    query: recommender systems advertising personalization
    category: digital-marketing
    subcategory_hint: measurement
  - source: dblp
    query: consumer behavior online
    category: consumer-behavior
    subcategory_hint: empirical
  - source: europepmc
    query: marketing consumer behavior digital
    category: consumer-behavior
    subcategory_hint: empirical

