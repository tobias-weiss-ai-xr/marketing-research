<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 960 320" font-family="Segoe UI,system-ui,sans-serif">
  <defs>
    <marker id="mhl-ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6c757d"/></marker>
  </defs>

  <!-- column 1: Model -->
  <rect x="10" y="40" width="280" height="240" rx="12" fill="#f4f7fa" stroke="#ced4da"/>
  <text x="150" y="72" text-anchor="middle" font-size="21" font-weight="700" fill="#165A97">Model</text>
  <text x="150" y="96" text-anchor="middle" font-size="15" fill="#6c757d">the reasoning engine</text>
  <circle cx="150" cy="160" r="42" fill="#e8eff6" stroke="#adb5bd" stroke-width="2"/>
  <path d="M 126 162 C 120 152 124 140 136 138 C 140 128 156 126 162 132 C 174 128 184 138 182 148 C 190 156 186 168 176 172 C 174 180 162 182 156 178 C 146 184 132 180 130 172 C 124 170 124 166 126 162 Z"
        fill="none" stroke="#212529" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 142 150 C 148 144 156 146 158 152" fill="none" stroke="#212529" stroke-width="1.8" opacity="0.7"/>
  <path d="M 146 164 C 154 158 162 162 164 168" fill="none" stroke="#212529" stroke-width="1.8" opacity="0.7"/>
  <text x="150" y="228" text-anchor="middle" font-size="16" fill="#212529">the brain</text>
  <text x="150" y="252" text-anchor="middle" font-size="14" fill="#6c757d">thinks, reasons, decides</text>

  <!-- arrow 1 -->
  <line x1="294" y1="160" x2="332" y2="160" stroke="#6c757d" stroke-width="2" marker-end="url(#mhl-ar)"/>

  <!-- column 2: Harness -->
  <rect x="340" y="40" width="280" height="240" rx="12" fill="#f4f7fa" stroke="#ced4da"/>
  <text x="480" y="72" text-anchor="middle" font-size="21" font-weight="700" fill="#165A97">Harness</text>
  <text x="480" y="96" text-anchor="middle" font-size="15" fill="#6c757d">tools + rules + memory</text>
  <rect x="385" y="118" width="190" height="52" rx="8" fill="#e8eff6" stroke="#adb5bd" stroke-width="2"/>
  <text x="480" y="143" text-anchor="middle" font-size="18" fill="#212529">files · git · browser</text>
  <text x="480" y="163" text-anchor="middle" font-size="14" fill="#6c757d">(pi, OpenCode, MCP tools)</text>
  <rect x="385" y="196" width="190" height="52" rx="8" fill="#e8eff6" stroke="#adb5bd" stroke-width="2"/>
  <text x="480" y="221" text-anchor="middle" font-size="18" fill="#212529">contract · memory</text>
  <text x="480" y="241" text-anchor="middle" font-size="14" fill="#6c757d">(rules, notes, history)</text>

  <!-- arrow 2 -->
  <line x1="624" y1="160" x2="662" y2="160" stroke="#6c757d" stroke-width="2" marker-end="url(#mhl-ar)"/>

  <!-- column 3: Loop -->
  <rect x="670" y="40" width="280" height="240" rx="12" fill="#f4f7fa" stroke="#ced4da"/>
  <text x="810" y="72" text-anchor="middle" font-size="21" font-weight="700" fill="#165A97">Loop</text>
  <text x="810" y="96" text-anchor="middle" font-size="15" fill="#6c757d">the work day</text>

  <rect x="700" y="116" width="95" height="46" rx="8" fill="#e8eff6" stroke="#c47f0e"/><text x="747" y="145" text-anchor="middle" font-size="16" fill="#212529">Plan</text>
  <rect x="812" y="116" width="95" height="46" rx="8" fill="#e8eff6" stroke="#c47f0e"/><text x="859" y="145" text-anchor="middle" font-size="16" fill="#212529">Act</text>
  <rect x="700" y="196" width="95" height="46" rx="8" fill="#e8eff6" stroke="#c47f0e"/><text x="747" y="225" text-anchor="middle" font-size="15" fill="#212529">Check</text>
  <rect x="812" y="196" width="95" height="46" rx="8" fill="#e8eff6" stroke="#c47f0e"/><text x="859" y="225" text-anchor="middle" font-size="15" fill="#212529">Correct</text>

  <line x1="797" y1="139" x2="808" y2="139" stroke="#6c757d" stroke-width="2" marker-end="url(#mhl-ar)"/>
  <line x1="859" y1="164" x2="859" y2="192" stroke="#6c757d" stroke-width="2" marker-end="url(#mhl-ar)"/>
  <line x1="797" y1="219" x2="806" y2="219" stroke="#6c757d" stroke-width="2" marker-end="url(#mhl-ar)"/>
  <path d="M 700 219 L 690 219 L 690 139 L 696 139" fill="none" stroke="#6c757d" stroke-width="2" marker-end="url(#mhl-ar)"/>
  <text x="810" y="272" text-anchor="middle" font-size="14" fill="#6c757d">repeat until verified</text>
</svg>
