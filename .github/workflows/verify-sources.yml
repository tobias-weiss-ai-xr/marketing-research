name: Verify Sources

# Repo-agnostic link-liveness audit for the paper corpus (papers.yaml).
# Two-stage verifier (scripts/verify_sources.py): HTTP check + optional
# Playwright recheck of uncertain URLs. Catches definitively-dead links
# (404/410/5xx/connection errors); 403/Cloudflare bot-blocks are warnings.
#
# Fails the run on definitively-dead links (404/410/400, 5xx-after-retry
# except 503, DNS failures). Anti-bot armor (401/403/405/406/418), rate-limits
# (429/503) and connection drops are warnings, not failures.

on:
  schedule:
    - cron: '30 7 * * 1'          # Monday 07:30 UTC — weekly link audit
  workflow_dispatch:
  push:
    paths:
      - 'papers.yaml'
      - 'repos.yaml'
      - 'scripts/verify_sources.py'
      - 'verify-sources.yaml'
      - '.github/workflows/verify-sources.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Verify paper links (fail on definitively-dead links)
        run: python scripts/verify_sources.py verify-sources.yaml --fail --no-fail-early

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-sources-report
          path: verify-sources-report.json
