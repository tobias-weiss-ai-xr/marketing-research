name: Validate Papers

on:
  push:
    branches: [main]
    paths:
      - 'papers.yaml'
      - 'scripts/'
      - 'config/'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'papers.yaml'
      - 'scripts/'
      - 'config/'
      - 'requirements.txt'
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC — incremental OpenAlex refresh
  workflow_dispatch:     # manual trigger for testing the refresh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Validate papers.yaml
        continue-on-error: false
        run: python3 scripts/validate_papers.py

      - name: Check README is up-to-date
        continue-on-error: false
        run: python3 scripts/generate_readme.py --check

  discover:
    # Incremental refresh: pull the last ~2 months of matches for every configured
    # OpenAlex query, de-duplicate, auto-classify, and commit. The marketing corpus
    # is OpenAlex/DOI-based (arXiv is a tiny slice), so this keeps it current.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Refresh OpenAlex (recent papers)
        env:
          OPENALEX_MAILTO: research@tobias-weiss-ai-xr.de
        run: python3 scripts/fetch/fetch_openalex_bulk.py --months 2 --per-category 20 --sleep 2

      - name: Validate papers.yaml
        run: python3 scripts/validate_papers.py

      - name: Commit & push if changed
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet papers.yaml; then echo "no new papers"; exit 0; fi
          git add papers.yaml
          git commit -m "Weekly OpenAlex refresh (auto)"
          git push origin main

  pages:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Generate papers.json + stats
        run: |
          python3 scripts/generate_readme.py
          python3 scripts/standard_stats.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
